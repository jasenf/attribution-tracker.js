name: Publish package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm test
      - run: npm run build
      - name: Publish when the version is new
        shell: bash
        run: |
          if node scripts/is-published.mjs; then
            echo "The package version is already available."
          else
            npm publish
          fi
