<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attribution Tracker form example</title>
  <style>
    body {
      max-width: 42rem;
      margin: 3rem auto;
      padding: 0 1rem;
      font: 16px/1.5 system-ui, sans-serif;
    }

    label,
    input,
    button {
      display: block;
      width: 100%;
      box-sizing: border-box;
    }

    input,
    button {
      margin: 0.35rem 0 1rem;
      padding: 0.7rem;
    }

    pre {
      overflow-x: auto;
      padding: 1rem;
      background: #f4f4f4;
    }
  </style>
</head>
<body>
  <h1>Attach first-touch attribution to a form</h1>
  <p>
    Open this page with UTM parameters, such as
    <code>?utm_source=newsletter&amp;utm_campaign=launch</code>, then submit the form.
  </p>

  <!-- Replace the action with your form or CRM endpoint. This shape also works with Formspree. -->
  <form id="lead-form" action="https://formspree.io/f/YOUR_FORM_ID" method="post">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="reader@example.com" required>

    <button type="submit">Preview submission</button>
  </form>

  <h2>Form payload</h2>
  <pre id="payload">Submit the form to see its fields.</pre>

  <script src="https://cdn.jsdelivr.net/gh/jasenf/attribution-tracker.js@v0.1.1/dist/attribution-tracker.js"></script>
  <script>
    const tracker = new AttributionTracker({
      // Replace this with a callback connected to your consent manager.
      consent: true
    });

    const form = document.querySelector('#lead-form');
    const payload = document.querySelector('#payload');

    function attachAttributionFields(targetForm, attribution) {
      targetForm.querySelectorAll('[data-attribution-field]').forEach((field) => field.remove());

      for (const [key, value] of Object.entries(attribution || {})) {
        const field = document.createElement('input');
        field.type = 'hidden';
        field.name = `attribution_${key}`;
        field.value = value;
        field.dataset.attributionField = '';
        targetForm.append(field);
      }
    }

    form.addEventListener('submit', (event) => {
      attachAttributionFields(form, tracker.getAll());

      // Remove this line when the form is connected to a real endpoint.
      event.preventDefault();
      payload.textContent = JSON.stringify(Object.fromEntries(new FormData(form)), null, 2);
    });
  </script>
</body>
</html>
